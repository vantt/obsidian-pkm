name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Cài đúng toolchain và component ghi trong rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Bộ so khớp (docs/PRD.md mục 6, 12): dựng kg-solo theo tag, preset, seed của spec/spec.lock,
      # rồi so bản Rust với golden của sha ghim (parity/golden/<sha>/). Không cần Python, không cần token.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Dựng vault kg-solo
        shell: bash
        run: |
          args=$(cargo run -q --locked -p pkm-parity -- fixture-args)
          npx --yes $args --out "$RUNNER_TEMP/kg-solo"
      - name: So bản Rust với golden
        shell: bash
        run: cargo run -q --locked -p pkm-parity -- check --vault "$RUNNER_TEMP/kg-solo" --report "$RUNNER_TEMP/parity-report.json"
