name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml gọi lại toàn bộ CI trước khi đăng.
  workflow_call:

permissions:
  contents: read

# Khi release.yml gọi, github.workflow là "Release": nhóm riêng, không huỷ CI của main và không bị nó huỷ.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Cài đúng toolchain và component ghi trong rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      # Bộ so khớp (docs/PRD.md mục 6, 12): dựng kg-solo theo tag, preset, seed của spec/spec.lock,
      # rồi so bản Rust với golden của sha ghim (parity/golden/<sha>/). Không cần Python, không cần token.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Dựng vault kg-solo
        shell: bash
        run: |
          args=$(cargo run -q --locked -p pkm-parity -- fixture-args)
          npx --yes $args --out "$RUNNER_TEMP/kg-solo"
      # Dump ghi ra RUNNER_TEMP, không vào target/: rust-cache lưu target/ nhưng xoá mọi file ngoài thư mục profile,
      # để lại khung thư mục rỗng (tables/, cli/, mcp/) thiếu manifest.json, lần chạy sau `check` từ chối ghi đè.
      - name: So bản Rust với golden
        shell: bash
        run: cargo run -q --locked -p pkm-parity -- check --vault "$RUNNER_TEMP/kg-solo" --dump-out "$RUNNER_TEMP/rust-dump" --report "$RUNNER_TEMP/parity-report.json"

  # Dựng, đóng gói, chạy thử bốn binary phát hành và thử bộ cài trên mọi PR, không đăng gì.
  assets:
    uses: ./.github/workflows/release-assets.yml
