[package]
name = "s1-yaml-probe"
version = "0.0.0"
edition = "2024"
publish = false
description = "Probe: compare Rust YAML crates with PyYAML (CSafeLoader without the timestamp resolver) on vault frontmatter"

# Standalone crate, deliberately outside the root workspace.
[workspace]

[dependencies]
libyaml-safer = "0.3.0"
regex = "1.13.1"
saphyr = "0.3.3"
saphyr-parser = "0.3.3"
serde_json = "1.0.154"
serde_norway = "0.9.42"
unicode-normalization = "0.1.26"
unsafe-libyaml = "0.2.11"
