[package]
name = "pkm-core"
description = "Lõi graph của PKM: đọc vault, schema, index SQLite, validator, truy vấn, tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
caseless = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
regex = "1"
sha1_smol = "1"
unicode-normalization = "0.1"
unsafe-libyaml = "0.2.11"
rusqlite = { version = "0.41.1", features = ["bundled", "functions", "hooks"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

# Server giả nói giao thức stdio của OHS, chỉ để test module `ohs` (không cần Node hay model). Không phát hành:
# bản phát hành chỉ dựng `-p pkm`.
[[bin]]
name = "fake-ohs"
path = "tests/support/fake_ohs.rs"
test = false
doctest = false
bench = false
